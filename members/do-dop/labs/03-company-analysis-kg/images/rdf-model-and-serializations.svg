<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">RDF 데이터 모델과 직렬화 문법</title>
  <desc id="desc">생텍쥐페리와 어린 왕자의 관계를 RDF 그래프로 표현하고, 동일한 그래프를 Turtle, RDF XML, JSON-LD로 기록하는 방법을 비교한다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#334155" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif; fill:#172033; }
      .title { font-size:28px; font-weight:700; }
      .sub { font-size:15px; fill:#64748b; }
      .label { font-size:14px; fill:#64748b; }
      .node-title { font-size:19px; font-weight:700; }
      .uri { font-size:13px; fill:#64748b; }
      .edge { stroke:#64748b; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
      .edge-label { font-size:16px; font-weight:700; }
      .panel-title { font-size:18px; font-weight:700; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:13px; fill:#334155; }
      .note { font-size:16px; font-weight:700; fill:#3730a3; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="24" fill="url(#bg)"/>
  <text x="55" y="55" class="title">RDF 모델과 직렬화 문법은 서로 다른 층이다</text>
  <text x="55" y="84" class="sub">위쪽은 데이터의 의미와 관계, 아래쪽은 같은 그래프를 텍스트로 기록하는 세 가지 방법이다.</text>

  <text x="55" y="132" class="label">1. RDF 데이터 모델: 노드와 관계로 사실을 표현</text>

  <g filter="url(#shadow)">
    <rect x="70" y="165" width="270" height="110" rx="55" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
    <text x="205" y="205" text-anchor="middle" class="label">Subject · Resource</text>
    <text x="205" y="234" text-anchor="middle" class="node-title">생텍쥐페리</text>
    <text x="205" y="257" text-anchor="middle" class="uri">person:SaintExupery</text>

    <rect x="860" y="165" width="270" height="110" rx="55" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
    <text x="995" y="205" text-anchor="middle" class="label">Object · Resource</text>
    <text x="995" y="234" text-anchor="middle" class="node-title">어린 왕자</text>
    <text x="995" y="257" text-anchor="middle" class="uri">book:TheLittlePrince</text>

    <rect x="860" y="310" width="270" height="105" rx="52" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="995" y="348" text-anchor="middle" class="label">Object · Literal</text>
    <text x="995" y="379" text-anchor="middle" class="node-title">“1943”</text>
    <text x="995" y="400" text-anchor="middle" class="uri">문자열 값</text>
  </g>

  <path d="M340 220H850" class="edge"/>
  <rect x="515" y="185" width="160" height="52" rx="10" fill="#f8fafc"/>
  <text x="595" y="207" text-anchor="middle" class="edge-label">wrote</text>
  <text x="595" y="227" text-anchor="middle" class="uri">Predicate · IRI</text>

  <path d="M995 275V300" class="edge"/>
  <rect x="760" y="278" width="190" height="50" rx="10" fill="#f8fafc"/>
  <text x="855" y="299" text-anchor="middle" class="edge-label">publishedYear</text>
  <text x="855" y="319" text-anchor="middle" class="uri">Predicate · IRI</text>

  <line x1="55" y1="455" x2="1145" y2="455" stroke="#cbd5e1"/>
  <rect x="430" y="438" width="340" height="34" rx="17" fill="#eef2ff"/>
  <text x="600" y="461" text-anchor="middle" class="note">같은 RDF 그래프, 서로 다른 표기법</text>

  <text x="55" y="505" class="label">2. 직렬화: 그래프를 파일이나 네트워크로 전달하기 위해 기록</text>

  <g filter="url(#shadow)">
    <rect x="55" y="530" width="340" height="175" rx="16" fill="#ffffff"/>
    <rect x="430" y="530" width="340" height="175" rx="16" fill="#ffffff"/>
    <rect x="805" y="530" width="340" height="175" rx="16" fill="#ffffff"/>
  </g>

  <text x="80" y="564" class="panel-title">Turtle</text>
  <text x="80" y="592" class="code">person:SaintExupery</text>
  <text x="80" y="616" class="code">  rel:wrote book:TheLittlePrince .</text>
  <text x="80" y="651" class="code">book:TheLittlePrince</text>
  <text x="80" y="675" class="code">  rel:publishedYear "1943" .</text>

  <text x="455" y="564" class="panel-title">RDF/XML</text>
  <text x="455" y="592" class="code">&lt;rdf:Description rdf:about=".../author"&gt;</text>
  <text x="455" y="616" class="code">  &lt;rel:wrote rdf:resource=".../book"/&gt;</text>
  <text x="455" y="640" class="code">&lt;/rdf:Description&gt;</text>

  <text x="830" y="564" class="panel-title">JSON-LD</text>
  <text x="830" y="592" class="code">{</text>
  <text x="830" y="616" class="code">  "@id": "person:SaintExupery",</text>
  <text x="830" y="640" class="code">  "rel:wrote": {</text>
  <text x="830" y="664" class="code">    "@id": "book:TheLittlePrince"</text>
  <text x="830" y="688" class="code">  }</text>
  <text x="1090" y="688" class="code">}</text>

  <text x="600" y="738" text-anchor="middle" class="sub">RDF는 의미를 정하는 데이터 모델이고, Turtle·RDF/XML·JSON-LD는 그 모델을 기록하는 문법이다.</text>
</svg>
