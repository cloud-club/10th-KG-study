# 10th-KG-study 로컬 인프라
#
#   cp .env.example .env        # 비밀번호/포트 조정 (기본값 그대로 써도 됨)
#   docker compose up -d        # postgres(pgvector) + elasticsearch(nori) + neo4j(apoc)
#   docker compose --profile ui up -d   # + kibana (ES 탐색용, 선택)
#   bash infra/check.sh         # 세 서비스가 제대로 떴는지 확인
#   docker compose down         # 중지 (데이터는 볼륨에 남음)
#   docker compose down -v      # 중지 + 데이터 초기화
#
# 자세한 사용법: infra/README.md

name: kg-study

services:
  # ── PostgreSQL 17 + pgvector ───────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg17
    container_name: kg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kg}
      POSTGRES_DB: ${POSTGRES_DB:-kg}
      # C.UTF-8: 정렬은 코드포인트 순(C 와 같음)이면서 한글을 "문자"로 인식함.
      # 순수 C 로케일이면 pg_trgm 이 한글에서 트라이그램을 못 뽑아 (show_trgm('한글') = {}) 인덱스가 무용지물.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro # 최초 기동 시 1회 실행 (extension 생성)
      - ./data:/data # 호스트 ./data ↔ 컨테이너 /data (COPY FROM '/data/...' 로 적재)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kg} -d ${POSTGRES_DB:-kg}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ── Elasticsearch 9 + analysis-nori (한국어 형태소) ────────────────────
  elasticsearch:
    build:
      context: ./infra/elasticsearch
      args:
        ES_VERSION: ${ES_VERSION:-9.1.0}
    image: kg-study/elasticsearch:${ES_VERSION:-9.1.0}
    container_name: kg-elasticsearch
    restart: unless-stopped
    environment:
      - cluster.name=kg-study
      - discovery.type=single-node
      - xpack.security.enabled=false # 로컬 전용. 인증 없이 http://localhost:9200
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms1g -Xmx1g}
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # ── Kibana (선택) — `docker compose --profile ui up -d` ───────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:${ES_VERSION:-9.1.0}
    container_name: kg-kibana
    profiles: ["ui"]
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - TELEMETRY_ENABLED=false
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ── Neo4j 5.26 LTS Community + APOC ────────────────────────────────────
  neo4j:
    image: neo4j:${NEO4J_VERSION:-5.26-community}
    container_name: kg-neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-kgstudy2026}
      - NEO4J_PLUGINS=${NEO4J_PLUGINS:-["apoc"]} # GDS 도 쓰려면 .env 에서 ["apoc","graph-data-science"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512m
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474" # Neo4j Browser
      - "${NEO4J_BOLT_PORT:-7687}:7687" # bolt 드라이버
    volumes:
      - neo4j_data:/data # 그래프 DB 저장소 (호스트 ./data 와 무관)
      - neo4j_logs:/logs
      - ./data:/import # 호스트 ./data ↔ LOAD CSV FROM 'file:///...' (홈 밖이라 권한 변경 없음)
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  pg_data:
  es_data:
  neo4j_data:
  neo4j_logs:
