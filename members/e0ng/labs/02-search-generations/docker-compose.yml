services:
  elasticsearch:
    build: ./src/elasticsearch-bm25
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: study
      POSTGRES_PASSWORD: study
      POSTGRES_DB: chat_search
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study -d chat_search"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/pgvector/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  elasticsearch-data:
  postgres-data:
