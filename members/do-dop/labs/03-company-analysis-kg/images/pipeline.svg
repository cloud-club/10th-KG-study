<svg viewBox="0 0 1000 1020" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="1020" fill="#ffffff"/>

  <text x="500" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">기업분석 지식 그래프 · 검색 파이프라인</text>
  <text x="500" y="52" text-anchor="middle" font-size="13" fill="#64748b">뉴스룸·DART 공시 → 청킹 → grep/BM25/벡터 검색 → RRF/점수정규화 융합 → RAG → Streamlit UI</text>

  <!-- section bands -->
  <rect x="0" y="70" width="1000" height="125" fill="#f8fafc"/>
  <rect x="0" y="205" width="1000" height="313" fill="#ffffff"/>
  <rect x="0" y="545" width="1000" height="90" fill="#f8fafc"/>
  <rect x="0" y="665" width="1000" height="90" fill="#ffffff"/>
  <rect x="0" y="785" width="1000" height="90" fill="#f8fafc"/>
  <rect x="0" y="902" width="1000" height="96" fill="#ffffff"/>

  <text x="20" y="88" font-size="12" font-weight="700" letter-spacing="1" fill="#94a3b8">01 데이터 수집</text>
  <text x="20" y="223" font-size="12" font-weight="700" letter-spacing="1" fill="#94a3b8">02 전처리</text>
  <text x="20" y="563" font-size="12" font-weight="700" letter-spacing="1" fill="#94a3b8">03 검색</text>
  <text x="20" y="683" font-size="12" font-weight="700" letter-spacing="1" fill="#94a3b8">04 융합</text>
  <text x="20" y="803" font-size="12" font-weight="700" letter-spacing="1" fill="#94a3b8">05 생성 (RAG)</text>
  <text x="20" y="920" font-size="12" font-weight="700" letter-spacing="1" fill="#94a3b8">06 서비스</text>

  <!-- arrows (drawn first so boxes sit on top of the line endpoints) -->
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <path d="M270,165 L270,190 L500,190 L500,215"/>
    <path d="M730,165 L730,190 L500,190 L500,215"/>
    <path d="M500,285 L500,325"/>
    <path d="M500,395 L500,432"/>
    <path d="M500,508 L500,531.5 L160,531.5 L160,555"/>
    <path d="M500,508 L500,555"/>
    <path d="M500,508 L500,531.5 L840,531.5 L840,555"/>
    <path d="M500,625 L500,650 L330,650 L330,675"/>
    <path d="M500,625 L500,650 L670,650 L670,675"/>
    <path d="M840,625 L840,650 L330,650 L330,675"/>
    <path d="M840,625 L840,650 L670,650 L670,675"/>
    <path d="M330,745 L330,795"/>
    <path d="M330,745 L330,770 L670,770 L670,795"/>
    <path d="M670,745 L670,770 L330,770 L330,795"/>
    <path d="M670,745 L670,795"/>
    <path d="M330,865 L330,888.5 L500,888.5 L500,912"/>
    <path d="M670,865 L670,888.5 L500,888.5 L500,912"/>
  </g>
  <g fill="#94a3b8">
    <polygon points="494,215 506,215 500,225"/>
    <polygon points="494,325 506,325 500,335"/>
    <polygon points="494,432 506,432 500,442"/>
    <polygon points="154,555 166,555 160,565"/>
    <polygon points="494,555 506,555 500,565"/>
    <polygon points="834,555 846,555 840,565"/>
    <polygon points="324,675 336,675 330,685"/>
    <polygon points="664,675 676,675 670,685"/>
    <polygon points="324,795 336,795 330,805"/>
    <polygon points="664,795 676,795 670,805"/>
    <polygon points="494,912 506,912 500,922"/>
  </g>

  <!-- 01 collection -->
  <rect x="140" y="95" width="260" height="70" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="270" y="125" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">뉴스룸 수집</text>
  <text x="270" y="145" text-anchor="middle" font-size="11" fill="#475569" font-family="monospace">collect_newsroom.py</text>

  <rect x="600" y="95" width="260" height="70" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="730" y="125" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">DART 공시 수집</text>
  <text x="730" y="145" text-anchor="middle" font-size="11" fill="#475569" font-family="monospace">collect_dart.py</text>

  <!-- 02 processing -->
  <rect x="350" y="215" width="300" height="70" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="500" y="245" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">문서 통합</text>
  <text x="500" y="265" text-anchor="middle" font-size="11" fill="#475569" font-family="monospace">merge_documents.py</text>

  <rect x="350" y="325" width="300" height="70" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="500" y="355" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">청킹 (최대 800자)</text>
  <text x="500" y="375" text-anchor="middle" font-size="11" fill="#475569" font-family="monospace">chunk_documents.py</text>

  <rect x="330" y="432" width="340" height="76" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="500" y="464" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">chunks.jsonl</text>
  <text x="500" y="486" text-anchor="middle" font-size="11" fill="#475569">69개 청크 · 뉴스룸 14 + 공시 5</text>

  <!-- 03 search -->
  <rect x="40" y="555" width="240" height="70" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="160" y="585" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">grep 검색</text>
  <text x="160" y="605" text-anchor="middle" font-size="11" fill="#475569" font-family="monospace">search_grep.py · 비교용</text>

  <rect x="380" y="555" width="240" height="70" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="500" y="585" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">BM25 검색</text>
  <text x="500" y="605" text-anchor="middle" font-size="11" fill="#475569" font-family="monospace">search_es.py</text>

  <rect x="720" y="555" width="240" height="70" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="840" y="585" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">벡터 검색</text>
  <text x="840" y="605" text-anchor="middle" font-size="11" fill="#475569" font-family="monospace">search_pgvector.py</text>

  <!-- 04 fusion -->
  <rect x="190" y="675" width="280" height="70" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="330" y="705" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">RRF 융합</text>
  <text x="330" y="725" text-anchor="middle" font-size="11" fill="#475569" font-family="monospace">rrf.py</text>

  <rect x="530" y="675" width="280" height="70" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="670" y="705" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">점수 정규화 융합</text>
  <text x="670" y="725" text-anchor="middle" font-size="11" fill="#475569" font-family="monospace">score_fusion.py</text>

  <!-- 05 generation -->
  <rect x="190" y="795" width="280" height="70" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="330" y="825" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">일반 RAG</text>
  <text x="330" y="845" text-anchor="middle" font-size="11" fill="#475569" font-family="monospace">chat.py</text>

  <rect x="530" y="795" width="280" height="70" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="670" y="825" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">에이전틱 검색</text>
  <text x="670" y="845" text-anchor="middle" font-size="11" fill="#475569" font-family="monospace">agentic_chat.py</text>

  <!-- 06 service -->
  <rect x="330" y="912" width="340" height="76" rx="12" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
  <text x="500" y="944" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Streamlit 챗봇 UI</text>
  <text x="500" y="966" text-anchor="middle" font-size="11" fill="#475569" font-family="monospace">app.py</text>
</svg>
