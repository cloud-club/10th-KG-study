    expected: "직행의 Redis(동일한 출발지 - 도착지의 통근 시간 저장), SeCause의 메시지 큐, SeCause의 outbox 패턴. 현재 표본 DB에서 status=proposed인 사용례 3개이며, 해당 기술이 모든 프로젝트에서 미구현이라는 뜻은 아니다."
