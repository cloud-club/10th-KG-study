<style>
/* 레이아웃: 1600×900 슬라이드를 세로로 쌓고 화면 폭에 맞춰 축소한다. #shot-<id> 로 열면 그 슬라이드 하나만 원본 크기로 보인다(스크린샷용). 밝은 테마 하나로 고정. */
:root {
  color-scheme: light;
  --page: #E8EBF0;
  --card: #FCFCFD;
  --ink: #17202D;
  --ink-2: #485365;
  --ink-3: #8790A0;
  --rule: #DCE1E8;
  --wash: #F1F3F6;
  --v1: #2C7A80;
  --v2: #4A4EC0;
  --v3: #A9620F;
  --ok: #1D8A4C;  --ok-bg: #E2F3E8;
  --mid: #9C6B00; --mid-bg: #FBF0D4;
  --bad: #C0362C; --bad-bg: #FAE3DF;
  --n-member: #44546A;
  --n-doc: #6F8090;
  --n-chunk: #97A3B1;
  --n-finding: #2B6FD3;
  --n-pitfall: #CF5239;
  --n-tech: #7D55C2;
  --n-data: #B98A12;
  --n-comm: #2F8E62;
  --n-wiki: #A9620F;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
body { background: var(--page); color: var(--ink); font-family: var(--sans); margin: 0; }
.wrap { max-width: 1640px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.pagehead { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; justify-content: space-between; margin: 0 0 20px; }
.pagehead h1 { font-size: 22px; margin: 0; text-wrap: balance; }
.pagehead p { margin: 0; color: var(--ink-2); font-size: 14px; max-width: 70ch; }
.frame { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; overflow: hidden; border-radius: 10px;
  box-shadow: 0 1px 2px rgba(23,32,45,.08), 0 8px 24px rgba(23,32,45,.07); margin-bottom: 28px; background: var(--card); }
.slide { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; background: var(--card);
  padding: 50px 72px 40px; display: flex; flex-direction: column; overflow: hidden; }
body.shot { background: var(--card); }
body.shot .wrap { padding: 0; max-width: none; }
body.shot .pagehead, body.shot .frame:not(.on) { display: none; }
body.shot .frame { width: 1600px; height: 900px; aspect-ratio: auto; border-radius: 0; box-shadow: none; margin: 0; }

.top { display: flex; justify-content: space-between; align-items: center; font: 500 14px/1 var(--mono); color: var(--ink-3); letter-spacing: .04em; }
.top b { color: var(--ink-2); font-weight: 600; }
.ttl { margin: 22px 0 6px; font-size: 38px; font-weight: 700; letter-spacing: -.01em; line-height: 1.25; text-wrap: balance; }
.lede { margin: 0; font-size: 19px; color: var(--ink-2); line-height: 1.55; max-width: 1400px; }
.foot { margin-top: auto; padding-top: 14px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--ink-3); gap: 24px; }
.legend { display: flex; gap: 16px; align-items: center; }
mark { padding: 1px 3px; border-radius: 3px; color: inherit; }
mark.ok { background: var(--ok-bg); box-shadow: inset 0 -2px 0 var(--ok); }
mark.bad { background: var(--bad-bg); box-shadow: inset 0 -2px 0 var(--bad); }
mark.meh { background: var(--wash); box-shadow: inset 0 -2px 0 var(--ink-3); }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 14px; font-size: 14px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.mid { background: var(--mid-bg); color: var(--mid); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.warn { background: transparent; color: var(--bad); border: 1.5px dashed var(--bad); height: 26px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.chip { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 5px; background: var(--wash); color: var(--ink-2); font: 500 13px/1 var(--mono); white-space: nowrap; }

.modes { display: flex; flex-direction: column; gap: 14px; }

.mode .dot { width: 12px; height: 12px; align-self: center; }
.mode h3 { margin: 0; font-size: 19px; }
.mode p { grid-column: 2; margin: 0; font-size: 15px; color: var(--ink-2); line-height: 1.5; }
.mode .sc { grid-column: 2; display: flex; gap: 8px; margin-top: 8px; font: 500 14px var(--mono); color: var(--ink-2); }
.mode .sc strong { font: 700 22px var(--sans); color: var(--ink); margin-right: 4px; }
table.mx { border-collapse: collapse; width: 100%; font-size: 16px; }
table.mx th { font: 500 13px var(--mono); color: var(--ink-3); text-align: left; padding: 0 10px 10px; letter-spacing: .04em; border-bottom: 1px solid var(--rule); }
table.mx td { padding: 0 10px; height: 44px; border-bottom: 1px solid var(--rule); }
table.mx td.q { font: 600 14px var(--mono); color: var(--ink-3); width: 54px; }
table.mx td.t { color: var(--ink-2); font-size: 14px; width: 118px; }
table.mx td.v { width: 92px; text-align: center; }
table.mx th.v { text-align: center; }
.vm { display: inline-flex; width: 30px; height: 30px; border-radius: 8px; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; position: relative; }
.vm.ok { background: var(--ok-bg); color: var(--ok); }
.vm.mid { background: var(--mid-bg); color: var(--mid); }
.vm.bad { background: var(--bad-bg); color: var(--bad); }
.vm i { position: absolute; right: -7px; top: -6px; font-style: normal; font-size: 12px; color: var(--bad); background: var(--card); border-radius: 50%; width: 15px; height: 15px; line-height: 15px; text-align: center; border: 1px solid var(--bad); }

/* ── 관찰 ── */
.obs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; margin-top: 32px; }
.ob { border: 1px solid var(--rule); border-radius: 10px; padding: 28px 30px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ob h3 { margin: 0; font-size: 24px; line-height: 1.35; text-wrap: balance; }
.ob p { margin: 0; font-size: 18px; line-height: 1.6; color: var(--ink-2); }
.ob .qs { display: flex; flex-wrap: wrap; gap: 6px; }
.ob .who { display: flex; gap: 6px; align-items: center; font: 600 13px var(--mono); color: var(--ink-3); }

/* ── 질문 슬라이드 ── */
.qhead { display: flex; gap: 16px; align-items: flex-start; margin-top: 18px; }
.qhead .qt { font-size: 29px; font-weight: 700; line-height: 1.38; margin: 0; text-wrap: balance; }
.qtype { flex: none; margin-top: 6px; height: 28px; padding: 0 12px; border-radius: 6px; border: 1.5px solid var(--ink); font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; }
.gold { margin-top: 16px; background: var(--ok-bg); border-radius: 10px; padding: 14px 20px; display: grid; grid-template-columns: 92px 1fr; gap: 4px 12px; }
.gold .k { font: 600 13px var(--mono); color: var(--ok); letter-spacing: .06em; padding-top: 4px; }
.gold .v { font-size: 18px; line-height: 1.55; font-weight: 500; }
.gold .s { grid-column: 2; font-size: 13px; color: var(--ink-2); }
.cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 18px; flex: 1; min-height: 0; }
.col { border: 1px solid var(--rule); border-radius: 10px; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.col .ch { display: flex; align-items: center; gap: 8px; padding: 13px 16px 0; }
.col .ch h4 { margin: 0; font-size: 17px; flex: 1; white-space: nowrap; }
.col .ev { padding: 6px 18px 0; font: 400 13px/1.45 var(--mono); color: var(--ink-3); }
.col .ans { padding: 12px 18px 0; font-size: 20px; line-height: 1.66; }
.col .ans p { margin: 0 0 10px; }
.col pre { margin: 8px 16px 0; padding: 9px 11px; background: var(--wash); border-radius: 6px; font: 400 12px/1.5 var(--mono); color: var(--ink-2); white-space: pre-wrap; }
.col .note { margin-top: auto; padding: 11px 16px 13px; border-top: 1px solid var(--rule); background: var(--wash); font-size: 16px; line-height: 1.6; color: var(--ink); }
.col .note b { font: 600 12px var(--mono); color: var(--ink-3); letter-spacing: .06em; margin-right: 6px; }

/* ── 그래프 슬라이드 ── */
.stage { position: relative; flex: 1; margin-top: 18px; }
.wires { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.wires text { font: 600 12px var(--mono); paint-order: stroke; stroke: var(--card); stroke-width: 5px; stroke-linejoin: round; }
.node { position: absolute; border-radius: 10px; background: var(--card); border: 1.5px solid var(--rule); padding: 10px 14px; z-index: 1; }
.lab { display: inline-flex; align-items: center; gap: 6px; font: 600 12px/1 var(--mono); letter-spacing: .03em; color: var(--ink-3); }
.lab .dot { width: 9px; height: 9px; }
.ent { position: absolute; z-index: 1; height: 54px; padding: 0 18px; border-radius: 27px; display: flex; align-items: center; gap: 9px; color: #fff; font-size: 18px; font-weight: 600; white-space: nowrap; }
.ent small { font: 500 11px var(--mono); opacity: .8; letter-spacing: .04em; }
.mem { position: absolute; z-index: 1; height: 46px; padding: 0 14px; border-radius: 23px; background: var(--n-member); color: #fff; display: flex; align-items: center; font: 600 15px var(--mono); white-space: nowrap; }
.fcard { position: absolute; z-index: 1; background: var(--card); border: 1.5px solid var(--rule); border-left: 5px solid var(--n-finding); border-radius: 8px; padding: 9px 14px; display: flex; flex-direction: column; gap: 4px; }
.fcard.pit { border-left-color: var(--n-pitfall); }
.fcard .r1 { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.fcard .met { font: 500 12px var(--mono); color: var(--n-finding); white-space: nowrap; }
.fcard.pit .met { color: var(--n-pitfall); }
.fcard .oc { margin-left: auto; font: 600 12px var(--mono); padding: 3px 8px; border-radius: 4px; white-space: nowrap; }
.fcard .oc + .oc { margin-left: 0; }
.fcard .oc.win { background: var(--ok-bg); color: var(--ok); }
.fcard .oc.lose { background: var(--bad-bg); color: var(--bad); }
.fcard .val { font-size: 16.5px; font-weight: 600; line-height: 1.35; }
.fcard .cond { font-size: 13.5px; color: var(--ink-2); line-height: 1.4; }
.fcard .mit { font-size: 13.5px; color: var(--ok); line-height: 1.4; }
.side { position: absolute; z-index: 1; border-radius: 10px; background: var(--wash); padding: 18px 20px; }
.side h4 { margin: 0 0 10px; font-size: 16px; }
.side ol, .side ul { margin: 0; padding-left: 20px; font-size: 14.5px; line-height: 1.55; color: var(--ink-2); display: flex; flex-direction: column; gap: 6px; }
.kv { display: grid; grid-template-columns: 96px 1fr; gap: 5px 12px; font-size: 14px; line-height: 1.45; margin-top: 8px; }
.kv dt { font: 500 12.5px var(--mono); color: var(--ink-3); padding-top: 1px; }
.kv dd { margin: 0; }
.chunktext { font: 400 12.5px/1.55 var(--mono); color: var(--ink-2); white-space: pre-wrap; margin-top: 8px; }

/* Neo4j 캡처 */
.dbshot { display: block; width: 100%; height: auto; margin-top: 18px; border-radius: 10px; box-shadow: 0 1px 3px rgba(23,32,45,.18); }

/* 스키마 표 */
table.schema { width: 100%; border-collapse: collapse; margin-top: 22px; }
table.schema th { text-align: left; font: 500 13px var(--mono); color: var(--ink-3); letter-spacing: .04em; padding: 0 12px 10px; border-bottom: 1px solid var(--rule); }
table.schema td { padding: 13px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; font-size: 15px; line-height: 1.5; }
table.schema td.ly { width: 150px; font-weight: 700; font-size: 17px; }
table.schema td.ly small { display: block; font-weight: 400; font-size: 13px; color: var(--ink-2); margin-top: 3px; }
table.schema td.how { width: 250px; color: var(--ink-2); font-size: 14px; }
table.schema td.cnt { width: 250px; font: 500 13.5px/1.6 var(--mono); color: var(--ink-2); }

.np { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 12px; color: #fff; font: 600 12.5px var(--mono); }

.cl { display: flex; flex-direction: column; gap: 7px; }
.cr { display: grid; grid-template-columns: 38px 230px 1fr 40px; align-items: center; gap: 10px; font-size: 14.5px; }
.cr .id { font: 600 13px var(--mono); color: var(--ink-3); }
.cr .bar { height: 14px; background: color-mix(in srgb, var(--n-comm) 30%, var(--card)); border-radius: 3px; position: relative; }
.cr .bar span { position: absolute; inset: 0 auto 0 0; background: var(--n-comm); border-radius: 3px; }
.cr .n { font: 500 13px var(--mono); color: var(--ink-2); text-align: right; }
.cr.hl { font-weight: 700; }
.cdet { border: 1.5px solid var(--n-comm); border-radius: 12px; padding: 22px 26px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.cdet h3 { margin: 0; font-size: 24px; }
.cdet p { margin: 0; font-size: 17px; line-height: 1.65; color: var(--ink-2); }
.cdet ul { margin: 0; padding-left: 18px; font-size: 16px; line-height: 1.55; display: flex; flex-direction: column; gap: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.t2c { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; margin-top: 22px; flex: 1; min-height: 0; }
.scene { border: 1px solid var(--rule); border-radius: 10px; padding: 18px 22px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.scene h3 { margin: 0; font-size: 23px; display: flex; gap: 10px; align-items: center; }
.scene pre { margin: 0; padding: 16px 18px; background: #1E2633; color: #E6EAF0; border-radius: 8px; font: 400 15px/1.55 var(--mono); white-space: pre-wrap; }
.scene pre .k { color: #9DB7FF; }
.scene pre .s { color: #F2C47A; }
table.res { border-collapse: collapse; font: 400 15.5px/1.4 var(--mono); width: 100%; }
table.res th { text-align: left; color: var(--ink-3); font-weight: 500; padding: 5px 8px; border-bottom: 1px solid var(--rule); }
table.res td { padding: 6px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.why { background: var(--wash); border-radius: 8px; padding: 16px 20px; font-size: 18px; line-height: 1.6; }

/* 집계 차트 */
.agg { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; margin-top: 24px; flex: 1; min-height: 0; }
.agg h3 { margin: 0 0 4px; font-size: 20px; }
.agg .sub { margin: 0 0 16px; font-size: 14.5px; color: var(--ink-2); }
.hb { display: grid; grid-template-columns: 110px 1fr 70px; align-items: center; gap: 10px; height: 30px; font-size: 14px; }
.hb .nm { font: 500 13.5px var(--mono); text-align: right; color: var(--ink-2); }
.hb .tr { height: 16px; display: flex; gap: 2px; }
.hb .tr span { height: 100%; border-radius: 2px; }
.hb .num { font: 500 13px var(--mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.axis { display: grid; grid-template-columns: 110px 1fr 70px; gap: 10px; margin-top: 6px; }
.axis div { position: relative; height: 16px; font: 400 11.5px var(--mono); color: var(--ink-3); }
.axis span { position: absolute; transform: translateX(-50%); }
</style>

function triStage(rows, ents, opts) {
  const y0 = 0, rowH = opts.rowH, gap = opts.gap;
  const groups = [];
  rows.forEach((r, i) => { const g = groups[groups.length - 1]; if (g && g.m === r.m) g.n.push(i); else groups.push({ m: r.m, n: [i] }); });
  let html = "", edges = [];
  groups.forEach((g, gi) => {
    const a = g.n[0], b = g.n[g.n.length - 1];
    const cy = y0 + (a * (rowH + gap) + b * (rowH + gap) + rowH) / 2;
    html += `<div class="mem" id="${opts.p}m${gi}" style="left:0;top:${cy - 23}px">${g.m}</div>`;
    g.n.forEach(i => edges.push([`${opts.p}m${gi}`, rows[i].id, "rep", opts.rep]));
  });
  rows.forEach((r, i) => {
    html += `<div class="fcard${opts.pit ? " pit" : ""}" id="${r.id}" style="left:${opts.fx}px;top:${y0 + i * (rowH + gap)}px;width:${opts.fw}px;height:${rowH}px">
      <div class="r1"><span class="met">${opts.pit ? "Pitfall" : "Finding · " + r.met}</span>${(r.vs || []).map(([t, o]) => `<span class="oc ${o}">vs ${opts.names[t]} · ${o}</span>`).join("")}</div><div class="val">${esc(r.val)}</div>
      <div class="${r.mit ? "mit" : "cond"}">${esc(r.cond)}</div></div>`;
  });
  ents.forEach(e => { html += `<div class="ent" id="${e.id}" style="left:${e.x}px;top:${e.y}px;background:var(${e.c || "--n-tech"})"><small>${e.lab || "Technique"}</small>${e.name}</div>`; });
  return { html, edges };
}

<span class="k">WHERE</span> f.kind = <span class="s">'measured'</span> AND a.name = <span class="s">'BM25'</span>

// ── 렌더 ──
const deck = document.getElementById("deck");
deck.innerHTML = slides.map(s => `<section class="frame" id="f-${s.id}"><div class="slide">${s.html}</div></section>`).join("");

const EDGE = { rep: ["var(--ink-3)", 1.4, ""], about: ["var(--ink-3)", 1.4, "5 5"], win: ["var(--ok)", 2.4, ""], lose: ["var(--bad)", 2.4, ""], occ: ["var(--n-pitfall)", 2, ""], mit: ["var(--ok)", 2, "6 4"], ev: ["var(--n-finding)", 2.2, ""] };
function wire(stage, scale) {
  const svg = stage.querySelector(".wires");
  const sr = stage.getBoundingClientRect();
  const box = el => { const r = el.getBoundingClientRect(); return { l: (r.left - sr.left) / scale, t: (r.top - sr.top) / scale, w: r.width / scale, h: r.height / scale }; };
  let out = "";
  JSON.parse(stage.dataset.edges).forEach(([a, b, kind, label]) => {
    const A = box(stage.querySelector("#" + a)), B = box(stage.querySelector("#" + b));
    const ax = A.l + A.w / 2, ay = A.t + A.h / 2, bx = B.l + B.w / 2, by = B.t + B.h / 2;
    let x1, y1, x2, y2, d;
    if (Math.abs(bx - ax) > Math.abs(by - ay) * 0.9 || B.l > A.l + A.w) {
      x1 = bx > ax ? A.l + A.w : A.l; y1 = ay; x2 = bx > ax ? B.l : B.l + B.w; y2 = by;
      const k = Math.max(40, Math.abs(x2 - x1) * 0.45) * (x2 > x1 ? 1 : -1);
      d = `M${x1},${y1} C${x1 + k},${y1} ${x2 - k},${y2} ${x2},${y2}`;
    } else {
      x1 = ax; y1 = by > ay ? A.t + A.h : A.t; x2 = bx; y2 = by > ay ? B.t : B.t + B.h;
      const k = Math.max(30, Math.abs(y2 - y1) * 0.45) * (y2 > y1 ? 1 : -1);
      d = `M${x1},${y1} C${x1},${y1 + k} ${x2},${y2 - k} ${x2},${y2}`;
    }
    const [c, w, dash] = EDGE[kind];
    out += `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" ${dash ? `stroke-dasharray="${dash}"` : ""} marker-end="url(#ar-${kind})"/>`;
    if (["ev"].includes(kind) || (["win", "lose"].includes(kind) && stage.dataset.edges.includes("WROTE")) || (kind === "rep" && stage.dataset.edges.includes("WROTE"))) {
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      out += `<text x="${mx}" y="${my - 6}" text-anchor="middle" fill="${c}">${label}</text>`;
    }
  });
  const defs = Object.entries(EDGE).map(([k, [c]]) => `<marker id="ar-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${c}"/></marker>`).join("");
  svg.innerHTML = `<defs>${defs}</defs>${out}`;
}
function layout() {
  const shot = location.hash.startsWith("#shot-") ? location.hash.slice(6) : null;
  document.body.classList.toggle("shot", !!shot);
  document.querySelectorAll(".frame").forEach(f => {
    f.classList.toggle("on", shot === f.id.slice(2));
    const s = shot ? 1 : f.clientWidth / 1600;
    const slide = f.firstElementChild;
    slide.style.transform = `scale(${s})`;
    slide.querySelectorAll(".stage[data-edges]").forEach(st => wire(st, s));
  });
}
window.addEventListener("resize", layout);
window.addEventListener("hashchange", layout);
layout();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(layout);
