<!doctype html><html lang="ko"><meta charset="utf-8"><title>이룸페이 · 관계와 근거</title><style>
body{margin:0;background:#101826;color:#e6edf7;font:15px system-ui}header{padding:22px 28px;border-bottom:1px solid #354156}h1{margin:0 0 6px;font-size:24px}small{color:#a9b7cb}main{display:grid;grid-template-columns:minmax(700px,1fr) 370px;height:82vh}svg{width:100%;height:100%;touch-action:none}aside{padding:22px;background:#192335;overflow:auto}button{background:#28415c;color:white;border:1px solid #6584a5;padding:8px;cursor:pointer}text{pointer-events:none;font-size:11px;fill:#e6edf7}.edge{stroke:#657e9d;fill:none;stroke-width:1.4;cursor:pointer}.edge:hover{stroke:#ffd56a;stroke-width:4}circle{cursor:grab;stroke:#d5e4f5;stroke-width:1.4}.label{font-size:10px;fill:#bdcfe6}pre{white-space:pre-wrap;word-break:break-word;font:13px system-ui;line-height:1.7}#detail{white-space:pre-wrap;line-height:1.7}</style>
<header><h1>이룸페이 · 문서에서 연결한 관계</h1><small>Neo4j 조회 결과 · 노드를 드래그하고 화살표를 클릭하면 근거를 확인할 수 있습니다.</small> <button id="toggle">관계 이름 숨기기</button></header>
<main><svg viewBox="0 0 1100 800"><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91a9c8"/></marker></defs><g id="lines"></g><g id="nodes"></g></svg><aside><h2>관계와 근거</h2><div id="detail">그래프는 문서에 기록된 설계를 표현합니다. 추출 후보를 원문과 대조해 보완했으며, 실제 서비스 동작을 검증한 결과는 아닙니다.

API → 서비스 → 해당 서비스의 API 경로는 호출 엔드포인트의 후보를 찾습니다. 해당 API가 실제 호출되었다는 뜻은 아닙니다.</div></aside></main>
<script>const data=__DATA__;const svg=document.querySelector('svg'),ns='http://www.w3.org/2000/svg',byId={};let show=true;
const colors={Service:'#4189bb',API:'#548954',Operation:'#9270be',Policy:'#bd853e',TransactionType:'#b65d79'};const cols={Service:140,API:360,Operation:600,Policy:820,TransactionType:1010};const counts={};data.nodes.forEach(n=>{counts[n.kind]=(counts[n.kind]||0)+1});const used={};
function el(tag,attrs,parent){let e=document.createElementNS(ns,tag);for(let k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e}
data.nodes.sort((a,b)=>a.id.localeCompare(b.id)).forEach(n=>{n.x=cols[n.kind];n.y=100+((used[n.kind]=(used[n.kind]||0)+1)-1)*Math.min(160,590/Math.max(1,counts[n.kind]-1));byId[n.id]=n;let g=el('g',{},document.querySelector('#nodes'));n.g=g;el('circle',{r:22,fill:colors[n.kind]},g);let t=el('text',{'text-anchor':'middle',y:40},g);let label=n.label.length>29?n.label.slice(0,27)+'…':n.label;t.textContent=label;let k=el('text',{'text-anchor':'middle',y:-31},g);k.textContent=n.kind;g.addEventListener('click',()=>document.querySelector('#detail').textContent=n.kind+'\n'+n.label+'\n\n'+data.edges.filter(e=>e.subject===n.id||e.object===n.id).map(e=>byId[e.subject].label+' → '+e.predicate+' → '+byId[e.object].label).join('\n\n'));g.addEventListener('pointerdown',e=>{n.drag=true;g.setPointerCapture(e.pointerId)});g.addEventListener('pointerup',()=>n.drag=false);g.addEventListener('pointermove',e=>{if(!n.drag)return;let pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;pt=pt.matrixTransform(svg.getScreenCTM().inverse());n.x=pt.x;n.y=pt.y;draw()})});
data.edges.forEach((e,i)=>{e.line=el('path',{class:'edge','marker-end':'url(#arrow)'},document.querySelector('#lines'));e.txt=el('text',{class:'label','text-anchor':'middle'},document.querySelector('#lines'));e.txt.textContent=e.predicate;e.offset=(i%3-1)*18;e.line.addEventListener('click',()=>{document.querySelector('#detail').textContent=byId[e.subject].label+'\n → '+e.predicate+' →\n'+byId[e.object].label+'\n\n조건\n'+(e.condition||'별도 조건 없음')+'\n\n근거\n'+JSON.parse(e.evidence).map(x=>x.field+' · '+x.chunk_id+'\n'+x.quote).join('\n\n')})});
function draw(){data.nodes.forEach(n=>n.g.setAttribute('transform',`translate(${n.x},${n.y})`));data.edges.forEach(e=>{let a=byId[e.subject],b=byId[e.object],dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,x=b.x-dx/len*25,y=b.y-dy/len*25,mx=(a.x+b.x)/2+e.offset,my=(a.y+b.y)/2-e.offset;e.line.setAttribute('d',`M ${a.x} ${a.y} Q ${mx} ${my} ${x} ${y}`);e.txt.setAttribute('x',mx);e.txt.setAttribute('y',my-5);e.txt.style.display=show?'':'none'})}document.querySelector('#toggle').onclick=()=>{show=!show;document.querySelector('#toggle').textContent=show?'관계 이름 숨기기':'관계 이름 보기';draw()};draw();</script></html>
