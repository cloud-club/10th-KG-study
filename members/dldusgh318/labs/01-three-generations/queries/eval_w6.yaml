      checked_at: '2026-10-07'
      scope: 20개 청크 표본에서 추출·병합한 현재 DB
      status_field: entities.props.status
      use_ids: [kg:use-jikhaeng-redis-1, kg:use-secause-mesiji-kyu-1, kg:use-secause-outbox-paeteon-1]
      sql: >-
        SELECT DISTINCT u.entity_id, p.label AS project, t.label AS technology,
        u.props->>'purpose' AS purpose, u.props->>'status' AS status
        FROM entities u
        JOIN edges pt ON pt.subject=u.entity_id AND pt.predicate='partOf'
        JOIN entities p ON p.entity_id=pt.object
        JOIN edges ut ON ut.subject=u.entity_id AND ut.predicate='usesTechnology'
        JOIN entities t ON t.entity_id=ut.object
        WHERE u.type='TechnologyUse' AND u.props->>'status'='proposed'
        ORDER BY p.label, t.label, u.entity_id;
